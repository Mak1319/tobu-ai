[project]
name = "topicable"
version = "0.1.0"
description = "Redis-triggered worker: document to markdown + subject relation graph"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.34.0",
    "docling>=2.115.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "markitdown[all]>=0.1.5",
    "pymongo>=4.10.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
]
