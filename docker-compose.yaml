        #     environment:
        #         REDIS_HOST: redis
        #         REDIS_PORT: ${REDIS_PORT:-6379}
        #         REDIS_PASSWORD: ${REDIS_PASSWORD}
        #         REDIS_EVENT_KEY: ${REDIS_EVENT_KEY}
        #         REDIS_DB: ${REDIS_DB:-0}
        #         MINIO_ENDPOINT: http://minio:9000
        #         MINIO_ROOT_USER: ${MINIO_ROOT_USER}
        #         MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        #         DOCUMENTS_BUCKET: ${DOCUMENTS_BUCKET:-documents-bucket}
        #         PROCESSED_BUCKET: ${PROCESSED_BUCKET:-processed-documents}
        #         STREAM_RESULT_KEY: ${STREAM_RESULT_KEY:-docling_result}
        #         CELERY_QUEUE: ${CELERY_QUEUE:-docling}
        #     depends_on:
