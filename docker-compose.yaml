networks:
    app-network:
        driver: bridge

volumes:
    minio_data:
    mongo_data:
    redis_data:

services:
    # ---------------------------------------------------------
    # MinIO - object storage
    # ---------------------------------------------------------
    minio:
        image: minio/minio:latest
        container_name: minio
        restart: unless-stopped
        ports:
            - "${MINIO_API_PORT}:9000"
            - "${MINIO_CONSOLE_PORT}:9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
            # Redis notification target, identifier = "primary"
            # -> resulting ARN: arn:minio:sqs::primary:redis
            MINIO_NOTIFY_REDIS_ENABLE_primary: "on"
            MINIO_NOTIFY_REDIS_ADDRESS_primary: "redis:6379"
            MINIO_NOTIFY_REDIS_PASSWORD_primary: ${REDIS_PASSWORD}
            MINIO_NOTIFY_REDIS_KEY_primary: ${REDIS_EVENT_KEY}
            MINIO_NOTIFY_REDIS_FORMAT_primary: "namespace"
        command: server /data --console-address ":9001"
        volumes:
            - minio_data:/data
        healthcheck:
            test:
                ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - app-network

    # ---------------------------------------------------------
    # One-shot job: creates buckets + wires the event notification.
    # Pure mc CLI, inline in compose - no external script files.
    # ---------------------------------------------------------
    createbuckets:
        image: minio/mc:latest
        container_name: minio-init
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: ["sh", "-c"]
        command:
            - |
                mc alias set myminio http://minio:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"
                mc mb --ignore-existing myminio/documents-bucket
                mc mb --ignore-existing myminio/processed-documents
                mc event add myminio/documents-bucket arn:minio:sqs::primary:redis --event put --ignore-existing
        networks:
            - app-network

    # ---------------------------------------------------------
    # MongoDB
    # ---------------------------------------------------------
    mongodb:
        image: mongo:latest
        container_name: mongodb
        restart: unless-stopped
        ports:
            - "${MONGO_PORT}:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
        volumes:
            - mongo_data:/data/db
        healthcheck:
            test:
                [
                    "CMD",
                    "mongosh",
                    "--quiet",
                    "--eval",
                    "db.runCommand('ping').ok",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - app-network

    # ---------------------------------------------------------
    # Redis Stack Server (redis + modules: JSON, Search, etc.)
    # ---------------------------------------------------------
    redis:
        image: redis/redis-stack-server:latest
        container_name: redis
        restart: unless-stopped
        environment:
            REDIS_ARGS: "--requirepass ${REDIS_PASSWORD}"
        ports:
            - "${REDIS_PORT}:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - app-network

    # ---------------------------------------------------------
    # Docling bridge — BLPOP MinIO events from Redis list, enqueue Celery
    # ---------------------------------------------------------
    docling-bridge:
        build:
            context: ./worker
        container_name: docling-bridge
        restart: unless-stopped
        command: ["uv", "run", "python", "main.py"]
        env_file:
            - .env
        environment:
            REDIS_HOST: redis
            REDIS_PORT: ${REDIS_PORT:-6379}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            REDIS_EVENT_KEY: ${REDIS_EVENT_KEY}
            REDIS_DB: ${REDIS_DB:-0}
            MINIO_ENDPOINT: http://minio:9000
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
            DOCUMENTS_BUCKET: ${DOCUMENTS_BUCKET:-documents-bucket}
            PROCESSED_BUCKET: ${PROCESSED_BUCKET:-processed-documents}
            PUBSUB_RESULT_CHANNEL: ${PUBSUB_RESULT_CHANNEL:-docling_results}
            CELERY_QUEUE: ${CELERY_QUEUE:-docling}
        depends_on:
            redis:
                condition: service_healthy
            minio:
                condition: service_healthy
        networks:
            - app-network

    # ---------------------------------------------------------
    # Docling Celery worker — convert documents, publish results
    # ---------------------------------------------------------
    docling-worker:
        build:
            context: ./worker
        container_name: docling-worker
        restart: unless-stopped
        command:
            [
                "uv",
                "run",
                "celery",
                "-A",
                "tasks",
                "worker",
                "--loglevel=INFO",
                "--queue=docling",
            ]
        env_file:
            - .env
        environment:
            REDIS_HOST: redis
            REDIS_PORT: ${REDIS_PORT:-6379}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            REDIS_DB: ${REDIS_DB:-0}
            MINIO_ENDPOINT: http://minio:9000
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
            DOCUMENTS_BUCKET: ${DOCUMENTS_BUCKET:-documents-bucket}
            PROCESSED_BUCKET: ${PROCESSED_BUCKET:-processed-documents}
            PUBSUB_RESULT_CHANNEL: ${PUBSUB_RESULT_CHANNEL:-docling_results}
            CELERY_QUEUE: ${CELERY_QUEUE:-docling}
        depends_on:
            redis:
                condition: service_healthy
            minio:
                condition: service_healthy
        networks:
            - app-network
