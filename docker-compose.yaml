networks:
    app-network:
        driver: bridge

volumes:
    minio_data:
    mongo_data:
    redis_data:

services:
    # ---------------------------------------------------------
    # MinIO - object storage
    # ---------------------------------------------------------
    minio:
        image: minio/minio:latest
        container_name: minio
        restart: unless-stopped
        ports:
            - 9000:9000
            - 9001:9001
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
            # Redis notification target, identifier = "primary"
            # -> resulting ARN: arn:minio:sqs::primary:redis
            #
            #
            MINIO_NOTIFY_REDIS_ADDRESS_primary: "redis:6379"
            MINIO_NOTIFY_REDIS_PASSWORD_primary: ${REDIS_PASSWORD}
            MINIO_NOTIFY_REDIS_KEY_primary: ${REDIS_EVENT_KEY}
            MINIO_NOTIFY_REDIS_FORMAT_primary: "access"
            MINIO_NOTIFY_REDIS_QUEUE_DIR_primary: ""
            MINIO_NOTIFY_REDIS_QUEUE_LIMIT_primary: "0"
            MINIO_NOTIFY_REDIS_ENABLE_primary: "on"
        command: server /data --console-address ":9001"
        volumes:
            - minio_data:/data
        healthcheck:
            test:
                ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - app-network

    # ---------------------------------------------------------
    # One-shot job: creates buckets + wires the event notification.
    # Pure mc CLI, inline in compose - no external script files.
    # ---------------------------------------------------------
    createbuckets:
        image: minio/mc:latest
        container_name: minio-init
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: ["sh", "-c"]
        command:
            - |
                mc alias set myminio http://minio:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"
                mc mb --ignore-existing myminio/documents-bucket
                mc mb --ignore-existing myminio/processed-documents

                mc event add myminio/documents-bucket arn:minio:sqs::primary:redis --event put --ignore-existing
        networks:
            - app-network

    # ---------------------------------------------------------
    # MongoDB
    # ---------------------------------------------------------
    mongodb:
        image: mongo:latest
        container_name: mongodb
        restart: unless-stopped
        ports:
            - "27017:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
        volumes:
            - mongo_data:/data/db
        healthcheck:
            test:
                [
                    "CMD",
                    "mongosh",
                    "--quiet",
                    "--eval",
                    "db.runCommand('ping').ok",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - app-network

    # ---------------------------------------------------------
    # Redis Stack Server (redis + modules: JSON, Search, etc.)
    # ---------------------------------------------------------
    redis:
        image: redis/redis-stack-server:latest
        container_name: redis
        restart: unless-stopped
        environment:
            REDIS_ARGS: "--requirepass ${REDIS_PASSWORD}"
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - app-network

