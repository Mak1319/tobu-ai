[project]
name = "quiz"
version = "0.1.0"
description = "LangGraph quiz agents: LiveKit orchestrator, question generator, answer analyzer"
requires-python = ">=3.13"
dependencies = [
    "ag-ui-langgraph>=0.0.42",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "langgraph>=1.2.10",
    "livekit-agents>=1.6.1",
    "livekit-plugins-openai>=1.6.7",
    "livekit-plugins-silero>=1.6.7",
    "numpy>=2.0.0",
    "piper-tts>=1.6.0",
    "pydantic>=2.13.4",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "pymongo>=4.12,<4.17",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "uvicorn>=0.52.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "shared",
    "livekit_voice_user_interaction_agent",
    "question_generator_agent",
    "answer_analyzer_agent",
]
