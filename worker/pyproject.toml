[project]
name = "worker"
version = "0.1.0"
description = "Celery-based docling worker triggered by MinIO events on a Redis list; publishes results over Redis pub/sub"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.34.0",
    "celery>=5.3.0",
    "docling>=2.115.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
]
