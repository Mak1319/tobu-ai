[project]
name = "imbbox2-worker"
version = "0.1.0"
description = "Document-processing worker for imbbox2: reacts to MinIO uploads, runs Docling, stores .md in processed-documents, deduplicates by content hash."
requires-python = ">=3.11,<3.13"
dependencies = [
    "minio>=7.2.0",
    "pymongo>=4.10.0",
    "docling>=2.0.0",
    "structlog>=24.4.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
