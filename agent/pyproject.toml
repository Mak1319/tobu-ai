[project]
name = "imbbox2-agent"
version = "0.1.0"
description = "LangGraph backend for imbbox2 -- syllabus-driven adaptive quiz agent"
dependencies = [
    "livekit-agents[openai,silero,turn-detector]",
    "livekit",
    "livekit-api",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-mongodb>=0.1.3",
    "langchain-core>=0.3.28",
    "langchain-openai>=0.2.14",
    "langchain-anthropic>=0.3.3",
    "langchain-google-genai>=2.0.7",
    "langchain-ollama>=0.2.2",
    "pymongo>=4.9.2",
    "minio>=7.2.13",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "python-dotenv>=1.0.1",
    # AG-UI: the event protocol spoken by tobu-ai-ui's chat wizard.
    "ag-ui-protocol>=0.1.15",
    # HTTP server that streams AG-UI events to the browser.
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "ag-ui-langgraph>=0.0.42",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]
